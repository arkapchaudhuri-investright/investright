# Caddy ships pointing at /etc/caddy/Caddyfile, which serves a welcome page.
# Send it to this host's multi-site config instead.
#
# ExecStart must be cleared with an empty assignment before being redefined —
# systemd otherwise APPENDS the second command rather than replacing it, and
# Caddy starts twice. Same for ExecReload.
[Service]
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /etc/investright/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/investright/Caddyfile --force
